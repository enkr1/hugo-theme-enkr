<article>
    <a href="{{ .context.RelPermalink }}">
        <div class="article-details">
            <h2 class="article-title">
                {{- .context.Title -}}
            </h2>
            <footer class="article-time">
                <time datetime='{{ .context.Date.Format "2006-01-02T15:04:05Z07:00" }}'>
                    {{- .context.Date | time.Format (or .context.Site.Params.dateFormat.published "Jan 02, 2006") -}}
                </time>
            </footer>
            {{ with .context.GetTerms "tags" }}
            <div class="article-tags">
                {{ range . }}<span>#{{ .LinkTitle }}</span>{{ end }}
            </div>
            {{ end }}
        </div>
    </a>
</article>
